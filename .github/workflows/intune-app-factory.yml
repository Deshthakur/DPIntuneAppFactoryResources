# Save as: .github/workflows/intune-app-factory.yml
#
# Required GitHub Variables (Settings > Secrets and variables > Actions > Variables):
#   TENANTID, CLIENTID, REPORTWORKSPACEID, ARCHIVESTORAGEACCOUNTNAME, ARCHIVECONTAINERNAME
# Required GitHub Secrets (names cannot contain "-"):
#   SA_ACCESSKEY      (was SA-IntuneAppFactory-AccessKey)
#   SP_CLIENTSECRET   (was SP-IntuneAppFactory-ClientSecret)
#   LA_PRIMARYKEY     (was LA-IntuneAppFactory-PrimaryKey)
#
# Runner: self-hosted Windows runner (closest to the ADO agent pool).
# If you switch to windows-latest, every job starts on a fresh VM, so
# Install-Modules.ps1 must run inside each job that needs the modules.

name: IntuneAppFactory

on:
  schedule:
    - cron: '0 */6 * * *'   # UTC, runs on default branch only
  workflow_dispatch:
    inputs:
      operationalMode:
        description: Select operational mode
        type: choice
        default: Publish
        options: [Verify, Package, Publish]
      archiveMode:
        description: Archive published apps
        type: choice
        default: 'No'
        options: ['Yes', 'No']

permissions:
  contents: read

concurrency:
  group: intune-app-factory
  cancel-in-progress: false

# Same env var names the ADO agent exposed, so the scripts need fewer edits
env:
  BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
  BUILD_BINARIESDIRECTORY: ${{ github.workspace }}/binaries
  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/staging
  TENANTID: ${{ vars.TENANTID }}
  CLIENTID: ${{ vars.CLIENTID }}
  REPORTWORKSPACEID: ${{ vars.REPORTWORKSPACEID }}
  ARCHIVESTORAGEACCOUNTNAME: ${{ vars.ARCHIVESTORAGEACCOUNTNAME }}
  ARCHIVECONTAINERNAME: ${{ vars.ARCHIVECONTAINERNAME }}

defaults:
  run:
    shell: powershell   # PowerShell@2 in ADO used Windows PowerShell 5.1

jobs:
  # Stage 1
  test_environment:
    runs-on: [self-hosted, windows]
    timeout-minutes: 5
    outputs:
      shouldrun: ${{ steps.check_template_files.outputs.shouldrun }}
    steps:
      - uses: actions/checkout@v6
      - name: Write-Variable
        run: ./Scripts/Write-Variable.ps1
      - name: Test-TemplatesFolder
        id: check_template_files
        run: ./Scripts/Test-TemplatesFolder.ps1

  # Stage 2
  prepare_environment:
    needs: test_environment
    if: needs.test_environment.outputs.shouldrun == 'true'
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install-Modules
        run: ./Scripts/Install-Modules.ps1
      - name: Remove-Files
        run: ./Scripts/Remove-Files.ps1

  # Stage 3
  check_app_files:
    needs: [test_environment, prepare_environment]
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    outputs:
      shouldrun: ${{ steps.test_app_files.outputs.shouldrun }}
    steps:
      - uses: actions/checkout@v6
      - name: Create folders
        run: New-Item -ItemType Directory -Force -Path $env:BUILD_BINARIESDIRECTORY, $env:BUILD_ARTIFACTSTAGINGDIRECTORY | Out-Null
      - name: Test-AppFiles
        id: test_app_files
        env:
          SA_ACCESSKEY: ${{ secrets.SA_ACCESSKEY }}
        run: ./Scripts/Test-AppFiles.ps1 -ConnectionString $env:SA_ACCESSKEY
      - uses: actions/upload-artifact@v6
        with:
          name: AppsProcessList
          path: ${{ env.BUILD_BINARIESDIRECTORY }}
          if-no-files-found: ignore

  # Stage 4
  check_new_app_version:
    needs: check_app_files
    if: needs.check_app_files.outputs.shouldrun == 'true' && (inputs.operationalMode || 'Publish') != 'Verify'
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    outputs:
      shouldrun: ${{ steps.test_app_list.outputs.shouldrun }}
    steps:
      - uses: actions/checkout@v6
      - name: Create folders
        run: New-Item -ItemType Directory -Force -Path $env:BUILD_BINARIESDIRECTORY, $env:BUILD_ARTIFACTSTAGINGDIRECTORY | Out-Null
      - uses: actions/download-artifact@v6
        with:
          name: AppsProcessList
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/AppsProcessList
      - name: Test-AppList
        id: test_app_list
        env:
          SP_CLIENTSECRET: ${{ secrets.SP_CLIENTSECRET }}
          SA_ACCESSKEY: ${{ secrets.SA_ACCESSKEY }}
        run: ./Scripts/Test-AppList.ps1 -TenantID $env:TENANTID -ClientID $env:CLIENTID -ClientSecret $env:SP_CLIENTSECRET -StorageAccountAccessKey $env:SA_ACCESSKEY
      - uses: actions/upload-artifact@v6
        with:
          name: AppsDownloadList
          path: ${{ env.BUILD_BINARIESDIRECTORY }}
          if-no-files-found: ignore

  # Stage 5
  download_new_apps:
    needs: check_new_app_version
    if: needs.check_new_app_version.outputs.shouldrun == 'true' && (inputs.operationalMode || 'Publish') != 'Verify'
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    outputs:
      shouldrun: ${{ steps.save_installer.outputs.shouldrun }}
    steps:
      - uses: actions/checkout@v6
      - name: Create folders
        run: New-Item -ItemType Directory -Force -Path $env:BUILD_BINARIESDIRECTORY, $env:BUILD_ARTIFACTSTAGINGDIRECTORY | Out-Null
      - uses: actions/download-artifact@v6
        with:
          name: AppsDownloadList
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/AppsDownloadList
      - name: Save-Installer
        id: save_installer
        env:
          SA_ACCESSKEY: ${{ secrets.SA_ACCESSKEY }}
        run: ./Scripts/Save-Installer.ps1 -StorageAccountAccessKey $env:SA_ACCESSKEY
      - uses: actions/upload-artifact@v6
        with:
          name: AppsPrepareList
          path: ${{ env.BUILD_BINARIESDIRECTORY }}
          if-no-files-found: ignore

  # Stage 6
  prepare_app_files:
    needs: download_new_apps
    if: needs.download_new_apps.outputs.shouldrun == 'true' && (inputs.operationalMode || 'Publish') != 'Verify'
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    outputs:
      shouldrun: ${{ steps.create_package_folder.outputs.shouldrun }}
    steps:
      - uses: actions/checkout@v6
      - name: Create folders
        run: New-Item -ItemType Directory -Force -Path $env:BUILD_BINARIESDIRECTORY, $env:BUILD_ARTIFACTSTAGINGDIRECTORY | Out-Null
      - uses: actions/download-artifact@v6
        with:
          name: AppsPrepareList
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/AppsPrepareList
      - name: Prepare-AppPackageFolder
        id: create_package_folder
        run: ./Scripts/Prepare-AppPackageFolder.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: AppsPublishList
          path: ${{ env.BUILD_BINARIESDIRECTORY }}
          if-no-files-found: ignore

  # Stage 7 (only when archiveMode = Yes)
  archive_apps:
    needs: prepare_app_files
    if: needs.prepare_app_files.outputs.shouldrun == 'true' && (inputs.archiveMode || 'No') == 'Yes' && (inputs.operationalMode || 'Publish') != 'Verify'
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Create folders
        run: New-Item -ItemType Directory -Force -Path $env:BUILD_BINARIESDIRECTORY, $env:BUILD_ARTIFACTSTAGINGDIRECTORY | Out-Null
      - uses: actions/download-artifact@v6
        with:
          name: AppsPublishList
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/AppsPublishList
      - name: New-AppArchive
        env:
          SA_ACCESSKEY: ${{ secrets.SA_ACCESSKEY }}
        run: ./Scripts/New-AppArchive.ps1 -StorageAccountName $env:ARCHIVESTORAGEACCOUNTNAME -ContainerName $env:ARCHIVECONTAINERNAME -StorageAccountKey $env:SA_ACCESSKEY

  # Stage 8 (only in Publish mode)
  publish_apps:
    needs: prepare_app_files
    if: needs.prepare_app_files.outputs.shouldrun == 'true' && (inputs.operationalMode || 'Publish') == 'Publish'
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    outputs:
      shouldrun: ${{ steps.new_app.outputs.shouldrun }}
    steps:
      - uses: actions/checkout@v6
      - name: Create folders
        run: New-Item -ItemType Directory -Force -Path $env:BUILD_BINARIESDIRECTORY, $env:BUILD_ARTIFACTSTAGINGDIRECTORY | Out-Null
      - uses: actions/download-artifact@v6
        with:
          name: AppsPublishList
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/AppsPublishList
      - name: New-Win32App
        id: new_app
        env:
          SP_CLIENTSECRET: ${{ secrets.SP_CLIENTSECRET }}
          LA_PRIMARYKEY: ${{ secrets.LA_PRIMARYKEY }}
        run: ./Scripts/New-Win32App.ps1 -TenantID $env:TENANTID -ClientID $env:CLIENTID -ClientSecret $env:SP_CLIENTSECRET -WorkspaceID $env:REPORTWORKSPACEID -SharedKey $env:LA_PRIMARYKEY
      - uses: actions/upload-artifact@v6
        with:
          name: AppsPublishedList
          path: ${{ env.BUILD_BINARIESDIRECTORY }}
          if-no-files-found: ignore

  # Stage 9 (only in Publish mode)
  assign_apps:
    needs: publish_apps
    if: needs.publish_apps.outputs.shouldrun == 'true' && (inputs.operationalMode || 'Publish') == 'Publish'
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Create folders
        run: New-Item -ItemType Directory -Force -Path $env:BUILD_BINARIESDIRECTORY, $env:BUILD_ARTIFACTSTAGINGDIRECTORY | Out-Null
      - uses: actions/download-artifact@v6
        with:
          name: AppsPublishedList
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/AppsPublishedList
      - name: New-AppAssignment
        env:
          SP_CLIENTSECRET: ${{ secrets.SP_CLIENTSECRET }}
        run: ./Scripts/New-AppAssignment.ps1 -TenantID $env:TENANTID -ClientID $env:CLIENTID -ClientSecret $env:SP_CLIENTSECRET
